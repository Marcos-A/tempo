name: tempo-preview

services:
  web:
    container_name: tempo-preview-web
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT not set; run scripts/deploy_preview.sh}
        BUILD_TIME: ${BUILD_TIME:-}
    command: python -m app.server
    env_file:
      - ${PREVIEW_ENV_FILE:-/srv/config/tempo/.env.preview}
    ports:
      - "127.0.0.1:${HOST_PORT:-8092}:8000"
    environment:
      DATABASE_URL: sqlite:///data/app.db
      WEB_CONCURRENCY: "1"
      APP_ENV: preview
      REPO_URL: ${REPO_URL:-}
      BUILD_META_DIR: /app/build-meta
    volumes:
      - ${PREVIEW_DATA_DIR:-/srv/data/tempo-preview}:/app/data
      # Holds release-info.json; a directory so a missing file never becomes a mount point.
      - ./build-meta:/app/build-meta:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/", timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
